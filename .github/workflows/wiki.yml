name: Wiki

# Publishes the guide. Its pages are the files in docs/wiki; the project's
# wiki shows them. Whatever is on the wiki is replaced by what is in the
# repository, so pages are changed there and never on the wiki itself. The
# wiki's own history is replaced too: it holds one commit, the latest.
#
# The wiki must exist first: tick "Wikis" under the repository's Settings,
# Features, and save a first page on the Wiki tab, once.

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish docs/wiki to the wiki
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wiki="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone --quiet "$wiki" published; then
            echo "::error::The wiki cannot be fetched. It has to exist before pages can be published to it: tick Wikis under Settings, Features, and save a first page on the Wiki tab; then run this workflow again."
            exit 1
          fi
          cd published
          branch="$(git symbolic-ref --short HEAD)"
          # The wiki keeps no history of its own: it is one commit, made here,
          # with exactly the pages of the repository. The history of the pages
          # is the repository's; and the page saved by hand to bring the wiki
          # into being, with the name and address of who saved it, is not kept.
          git checkout --quiet --orphan fresh
          git read-tree --empty
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../docs/wiki/. .
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "The guide, as of ${GITHUB_SHA::7}"
          if [ "$(git rev-list --count "origin/$branch")" = 1 ] &&
            [ "$(git rev-parse "origin/$branch^{tree}")" = "$(git rev-parse "fresh^{tree}")" ]; then
            echo "The wiki is as the repository has it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push --quiet --force origin "fresh:$branch"
          echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/wiki" >> "$GITHUB_STEP_SUMMARY"
