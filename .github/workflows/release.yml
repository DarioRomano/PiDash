name: Release

# Publishes a GitHub release when a version tag is pushed:
#   make release VERSION=v0.2.0
# The packages attached here are what install.sh and every Pi's update.sh download.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for the generated release notes

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the frontend
        run: cd web && npm ci && npm run build

      - name: Test
        run: go test ./...

      - name: Build the release packages
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/dist.sh "$TAG"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag like v0.3.0-rc.1 becomes a pre-release, which "latest" skips.
          extra=()
          case "$TAG" in *-*) extra+=(--prerelease) ;; esac
          gh release create "$TAG" dist/pidash_linux_*.tar.gz dist/SHA256SUMS \
            --title "PiDash $TAG" --generate-notes "${extra[@]}"
