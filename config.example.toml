# PiDash configuration. Lives at ~/.config/pidash/config.toml on the Pi.
# After editing: systemctl --user restart pidash
# Every key is optional; omitted keys use the built-in defaults shown here.

[server]
listen = ":8080"

[display]
# Inset on every edge as a fraction of the screen, for TVs that overscan.
# Prefer setting the TV to "Just Scan" / "Screen Fit" and leaving this small.
safe_area = 0.03
# Show the last raw key code and mapped action in the corner. Turn on while
# mapping a new TV remote over CEC, off once everything works.
debug_keys = true
# Nudge the UI by up to this many pixels every few minutes (OLED/plasma burn-in). 0 = off.
pixel_shift = 4
clock_24h = true
# BCP 47 locale for the date, e.g. "en-GB", "it-IT". Empty = browser default.
locale = ""

[system]
enabled = true
interval = "10s"

[kiosk]
# systemd user unit that runs the fullscreen browser. It powers "Show on TV" and
# "Exit to desktop" on the phone remote and hold-Back-to-exit on the TV remote.
# Set to "" to disable those controls.
unit = "pidash-kiosk.service"

# --- Apps -------------------------------------------------------------------
# Things you can launch from the dashboard: press OK to open the app row.
# Add one [[apps]] block per app. An app is either a website or a program.
#
#   id          short unique name: a-z, 0-9 and "-"
#   name        what the TV shows (defaults to id)
#   icon        optional. Leave it out and PiDash uses the installed program's
#               own icon, or a built-in one for YouTube, Netflix and Synology
#               Photos. Set a path to an SVG/PNG to use your own.
#
# A website, shown fullscreen in its own browser profile (logins are remembered
# and kept separate from your normal browser):
#   url         full address, starting with http:// or https://
#   browser     "chromium" (default) or "firefox"
#   adblock     true installs uBlock Origin into that profile (Firefox only)
#   user_agent  optional: pretend to be another device, for sites that only
#               show their TV interface to TVs
#
# A program:
#   command     what to run, exactly as you would type it in a terminal
#   mode        "desktop" (default): runs on the desktop like any other program.
#               "console": runs on its own virtual terminal, outside the desktop,
#                          so the app drives the screen directly. Best for game
#                          streaming and video players: lower latency, HDR and
#                          refresh-rate switching. Needs a one-time setup:
#                          bash deploy/install.sh --console-apps
#
# While an app is running, the phone remote shows "Back to dashboard".

# YouTube's TV interface, made for remote controls: arrow keys and OK work.
# Runs in Firefox with uBlock Origin. The user agent makes YouTube serve the TV
# interface; remove user_agent and use https://www.youtube.com/ for the normal site.
[[apps]]
id = "youtube"
name = "YouTube"
url = "https://www.youtube.com/tv"
browser = "firefox"
adblock = true
user_agent = "Mozilla/5.0 (PS4; Leanback Shell) Gecko/20100101 Firefox/65.0 LeanbackShell/01.00.01.75 Sony PS4/ (PS4, , no, CH)"

# Netflix in Chromium, which has the DRM module Netflix requires on the Pi.
# Sign in once with a keyboard; the login is remembered.
[[apps]]
id = "netflix"
name = "Netflix"
url = "https://www.netflix.com/browse"

# Synology Photos. Replace YOUR-NAS with your NAS address or name, then remove
# the "# " in front of these lines. Use the address you open Synology Photos
# with in a browser, for example:
#   http://192.168.1.20:5000/?launchApp=SYNO.Foto.AppInstance
#   https://photos.example.com/photo/
#
# [[apps]]
# id = "synology-photos"
# name = "Photos"
# url = "http://YOUR-NAS:5000/?launchApp=SYNO.Foto.AppInstance"

# More examples:
#
# [[apps]]
# id = "moonlight"
# name = "Moonlight"
# command = "moonlight-qt"
# mode = "console"
#
# [[apps]]
# id = "kodi"
# name = "Kodi"
# command = "kodi-standalone"
# mode = "console"
#
# [[apps]]
# id = "steamlink"
# name = "Steam Link"
# command = "steamlink"

# Map browser KeyboardEvent.code values to actions.
# Actions: up down left right select back menu home playpause exit 0-9
# "exit" closes the dashboard and returns to the desktop. Holding any key mapped
# to "back" for two seconds does the same, so a TV remote always has a way out.
# If this table is present it REPLACES the defaults, so list everything you need.
# Find the codes your remote sends by enabling display.debug_keys above.
[input.keys]
ArrowUp = "up"
ArrowDown = "down"
ArrowLeft = "left"
ArrowRight = "right"
Enter = "select"
NumpadEnter = "select"
Space = "select"
Escape = "back"
Backspace = "back"
BrowserBack = "back"
ContextMenu = "menu"
Home = "home"
F10 = "exit"
MediaPlayPause = "playpause"
MediaPlay = "playpause"
MediaPause = "playpause"
Digit0 = "0"
Digit1 = "1"
Digit2 = "2"
Digit3 = "3"
Digit4 = "4"
Digit5 = "5"
Digit6 = "6"
Digit7 = "7"
Digit8 = "8"
Digit9 = "9"
