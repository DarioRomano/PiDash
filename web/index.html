<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, initial-scale=1" />
    <title>PiDash</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="fit">
    <div id="stage">
      <div id="backdrop" aria-hidden="true">
        <!-- The moving colours behind the clock while no photo is shown. -->
        <canvas id="ambient"></canvas>
        <div id="grain"></div>
      </div>
      <div id="scrim" aria-hidden="true"></div>

      <main id="overlay" data-density="compact">
        <section id="clock">
          <div id="time"><span id="hm">--:--</span><span id="ampm"></span></div>
          <div id="date">&nbsp;</div>
        </section>
        <section id="caption"></section>
        <!-- Opposite the clock: the next calendar events, and under them the weather. -->
        <aside id="side">
          <section id="agenda" hidden></section>
          <section id="weather" hidden></section>
        </aside>
      </main>

      <aside id="status">
        <span id="conn" class="dot" title="Connection"></span>
        <span id="stale" hidden>stale</span>
        <span id="debug" hidden></span>
      </aside>

      <nav id="rail" aria-hidden="true">
        <div id="rail-strip"></div>
        <div id="rail-hint"></div>
      </nav>

      <section id="weather-panel" aria-hidden="true"></section>

      <!-- Shown while a mouse, touchpad or touch screen is in use. -->
      <div id="hud" aria-label="Controls"></div>

      <section id="help" aria-hidden="true"></section>

      <section id="status-panel" aria-hidden="true"></section>

      <div id="toast" role="status"></div>

      <div id="exit-hint" role="status">Keep holding to exit to the desktop…</div>
    </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
