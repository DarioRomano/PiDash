<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>PiDash Remote</title>
    <link rel="stylesheet" href="/src/remote.css" />
  </head>
  <body>
    <header>
      <h1>PiDash</h1>
      <span id="status" class="dot"></span>
    </header>

    <section class="row" id="kiosk" hidden>
      <button id="kiosk-start">Show on TV</button>
      <button id="kiosk-stop">Exit to desktop</button>
    </section>

    <section class="row" id="tv-row" hidden>
      <button id="tv-on">TV on</button>
      <button id="tv-off">TV off</button>
    </section>

    <section id="apps" hidden>
      <div id="running" class="row" hidden>
        <span id="running-name"></span>
        <button id="app-stop">Back to dashboard</button>
      </div>
      <div id="app-list"></div>
      <p id="app-msg" hidden></p>
    </section>

    <section id="pad-box" hidden>
      <div id="pad" role="application" aria-label="Touchpad">
        <span>Drag to move · tap to click<br />two fingers to scroll · two-finger tap for right click</span>
      </div>
      <div class="row small">
        <button id="click-left">Click</button>
        <button id="click-right">Right click</button>
        <button id="drag" aria-pressed="false">Hold</button>
      </div>
      <div class="row small">
        <button data-key="escape">Esc</button>
        <button data-key="tab">Tab</button>
        <button data-key="backspace" aria-label="Backspace">⌫</button>
        <button data-key="enter">Enter</button>
      </div>
      <form id="textform" class="row" hidden>
        <input id="text" type="text" placeholder="Type on the TV…" autocomplete="off" autocapitalize="off" />
        <button type="submit">Type</button>
      </form>
    </section>
    <p id="pad-note" class="note" hidden></p>

    <section class="dpad">
      <button data-action="up" aria-label="Up">▲</button>
      <button data-action="left" aria-label="Left">◀</button>
      <button data-action="select" class="ok">OK</button>
      <button data-action="right" aria-label="Right">▶</button>
      <button data-action="down" aria-label="Down">▼</button>
    </section>

    <section class="row">
      <button data-action="back">Back</button>
      <button data-action="home">Home</button>
      <button data-action="playpause">⏯</button>
    </section>

    <section class="numpad">
      <button data-action="1">1</button><button data-action="2">2</button><button data-action="3">3</button>
      <button data-action="4">4</button><button data-action="5">5</button><button data-action="6">6</button>
      <button data-action="7">7</button><button data-action="8">8</button><button data-action="9">9</button>
      <button data-action="0" class="zero">0</button>
    </section>

    <a id="photos-link" class="link" href="/photos" hidden>Background photos<span>›</span></a>

    <footer id="version"></footer>

    <script type="module" src="/src/remote.ts"></script>
  </body>
</html>
